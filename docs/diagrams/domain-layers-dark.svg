<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 528" width="1180" height="528" role="img" aria-labelledby="t d"><title id="t">The domain is four files, the engine is unchanged</title><desc id="d">Four configuration file cards across the top, labelled you write. Below a dashed line marked the line between configuration and code, a single dark slab labelled the engine, identical for every domain, listing the module names a domain author never edits.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><text x="64" y="44" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#76a3ff" letter-spacing="1.6">YOU WRITE</text><text x="64" y="66" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#9da3ae">Four files. No Python.</text><rect x="64" y="92" width="258" height="192" rx="6" fill="#1a1b21" stroke="#2a2b32" stroke-width="1"/><rect x="70" y="92" width="246" height="3.5" rx="0" fill="#76a3ff"/><text x="84" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="9.5" font-weight="700" fill="#76a3ff" letter-spacing="1.4">ANALYZERS</text><text x="84" y="158" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#ecedf1">configs/analyzers/&lt;domain&gt;/</text><line x1="84" y1="176" x2="302" y2="176" stroke="#2a2b32" stroke-width="1"/><text x="84" y="202" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">What kinds of document exist,</text><text x="84" y="223" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">and how the reader should treat</text><text x="84" y="244" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">each of them</text><rect x="344" y="92" width="258" height="192" rx="6" fill="#1a1b21" stroke="#2a2b32" stroke-width="1"/><rect x="350" y="92" width="246" height="3.5" rx="0" fill="#76a3ff"/><text x="364" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="9.5" font-weight="700" fill="#76a3ff" letter-spacing="1.4">ONTOLOGY</text><text x="364" y="158" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#ecedf1">configs/ontology/&lt;domain&gt;.yaml</text><line x1="364" y1="176" x2="582" y2="176" stroke="#2a2b32" stroke-width="1"/><text x="364" y="202" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">What may exist in the graph:</text><text x="364" y="223" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">node labels, edge types, the</text><text x="364" y="244" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">vocabulary of party roles</text><rect x="624" y="92" width="258" height="192" rx="6" fill="#1a1b21" stroke="#2a2b32" stroke-width="1"/><rect x="630" y="92" width="246" height="3.5" rx="0" fill="#76a3ff"/><text x="644" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="9.5" font-weight="700" fill="#76a3ff" letter-spacing="1.4">PACKS</text><text x="644" y="158" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#ecedf1">configs/packs/&lt;domain&gt;.yaml</text><line x1="644" y1="176" x2="862" y2="176" stroke="#2a2b32" stroke-width="1"/><text x="644" y="202" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">The build contract. A closed set,</text><text x="644" y="223" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">so anything unmapped is</text><text x="644" y="244" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">quarantined instead of guessed</text><rect x="904" y="92" width="258" height="192" rx="6" fill="#1a1b21" stroke="#2a2b32" stroke-width="1"/><rect x="910" y="92" width="246" height="3.5" rx="0" fill="#76a3ff"/><text x="924" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="9.5" font-weight="700" fill="#76a3ff" letter-spacing="1.4">VIEWS</text><text x="924" y="158" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="600" fill="#ecedf1">configs/views/&lt;domain&gt;_ops.yaml</text><line x1="924" y1="176" x2="1142" y2="176" stroke="#2a2b32" stroke-width="1"/><text x="924" y="202" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">The field schema. What to capture,</text><text x="924" y="223" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">its type, and how its evidence</text><text x="924" y="244" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#9da3ae">is found. This is the target</text><text x="924" y="264" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11" font-weight="700" fill="#4dd4ac" letter-spacing="0.6">start here</text><line x1="64" y1="336" x2="1116" y2="336" stroke="#33353d" stroke-width="1" stroke-dasharray="5 5"/><rect x="422.0" y="323" width="336" height="26" rx="13" fill="#1a1b21"/><text x="590.0" y="341" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#9da3ae" text-anchor="middle">the line between configuration and code</text><rect x="64" y="376" width="1052" height="118" rx="6" fill="#0f1014" stroke="#33353d" stroke-width="1"/><text x="88" y="412" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#7d838e" letter-spacing="1.6">YOU DO NOT TOUCH</text><text x="88" y="438" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="400" fill="#ecedf1">The engine. Identical for every domain.</text><rect x="88" y="454" width="138.39999999999998" height="24" rx="12" fill="none" stroke="#7d838e" stroke-width="1" opacity="0.45"/><text x="157.2" y="470" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#7d838e" text-anchor="middle">pipeline/extraction</text><rect x="235.39999999999998" y="454" width="85.6" height="24" rx="12" fill="none" stroke="#7d838e" stroke-width="1" opacity="0.45"/><text x="278.2" y="470" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#7d838e" text-anchor="middle">pipeline/kb</text><rect x="330.0" y="454" width="105.39999999999999" height="24" rx="12" fill="none" stroke="#7d838e" stroke-width="1" opacity="0.45"/><text x="382.7" y="470" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#7d838e" text-anchor="middle">pipeline/store</text><rect x="444.4" y="454" width="59.199999999999996" height="24" rx="12" fill="none" stroke="#7d838e" stroke-width="1" opacity="0.45"/><text x="474.0" y="470" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#7d838e" text-anchor="middle">api/rag</text><rect x="512.5999999999999" y="454" width="79.0" height="24" rx="12" fill="none" stroke="#7d838e" stroke-width="1" opacity="0.45"/><text x="552.0999999999999" y="470" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#7d838e" text-anchor="middle">api/routes</text><rect x="600.5999999999999" y="454" width="59.199999999999996" height="24" rx="12" fill="none" stroke="#7d838e" stroke-width="1" opacity="0.45"/><text x="630.1999999999999" y="470" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#7d838e" text-anchor="middle">web/src</text><text x="1092" y="438" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#7d838e" text-anchor="end">one deployment serves one domain</text></svg>
