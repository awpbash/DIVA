<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-labelledby="t d"><title id="t">One container, three things outside it</title><desc id="d">A browser talks over HTTPS to a single application container, marked with the Docker logo and holding FastAPI, the retrieval agent and the ingestion pipeline. The container in turn talks to an OpenAI-compatible model endpoint, marked with the OpenAI logo, a Cosmos DB database, marked with the Azure logo, and a local storage folder, drawn as a plain folder because it is a role rather than a product.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="56" y="210" width="220" height="160" rx="8" fill="#ffffff" stroke="#d8dae0" stroke-width="1"/><rect x="56" y="210" width="220" height="24" rx="8" fill="#f5f6f8" stroke="#d8dae0" stroke-width="1"/><rect x="56" y="224" width="220" height="10" rx="0" fill="#f5f6f8"/><circle cx="72" cy="222" r="3.2" fill="#9aa0ab"/><circle cx="86" cy="222" r="3.2" fill="#9aa0ab"/><circle cx="100" cy="222" r="3.2" fill="#9aa0ab"/><text x="166.0" y="276" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#1b1c21" text-anchor="middle">React workspace</text><text x="166.0" y="302" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#6c7280" text-anchor="middle">chat · review · knowledge</text><text x="166.0" y="320" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#6c7280" text-anchor="middle">explore · admin</text><text x="166.0" y="354" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,