<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-labelledby="t d"><title id="t">One container, three things outside it</title><desc id="d">A browser talks over HTTPS to a single application container holding FastAPI, the retrieval agent and the ingestion pipeline. The container in turn talks to a model endpoint, a Cosmos DB database, and a local storage folder, drawn as a cloud, a cylinder and a folder respectively.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="56" y="210" width="220" height="160" rx="8" fill="#1c1d23" stroke="#33353d" stroke-width="1"/><rect x="56" y="210" width="220" height="24" rx="8" fill="#1a1b21" stroke="#33353d" stroke-width="1"/><rect x="56" y="224" width="220" height="10" rx="0" fill="#1a1b21"/><circle cx="72" cy="222" r="3.2" fill="#6c7280"/><circle cx="86" cy="222" r="3.2" fill="#6c7280"/><circle cx="100" cy="222" r="3.2" fill="#6c7280"/><text x="166.0" y="276" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#ecedf1" text-anchor="middle">React workspace</text><text x="166.0" y="302" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#9da3ae" text-anchor="middle">chat · review · knowledge</text><text x="166.0" y="320" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#9da3ae" text-anchor="middle">explore · admin</text><text x="166.0" y="354" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#6c7280" text-anchor="middle" letter-spacing="1.4">Browser</text><rect x="330" y="60" width="420" height="440" rx="12" fill="none" stroke="#33353d" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M 348 86.0 L 358.0 76 L 368 86.0 L 358.0 96 Z" fill="none" stroke="#76a3ff" stroke-width="1.4" stroke-linejoin="round"/><path d="M 348 86.0 L 358.0 96 L 358.0 112.0 L 348 102.0 Z" fill="none" stroke="#76a3ff" stroke-width="1.4" stroke-linejoin="round" opacity="0.7"/><path d="M 368 86.0 L 358.0 96 L 358.0 112.0 L 368 102.0 Z" fill="none" stroke="#76a3ff" stroke-width="1.4" stroke-linejoin="round" opacity="0.55"/><text x="384" y="94" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#76a3ff" letter-spacing="1.4">APPLICATION CONTAINER</text><text x="732" y="94" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#6c7280" text-anchor="end">one image, one port</text><rect x="350" y="118" width="380" height="96" rx="8" fill="#1a1b21" stroke="#2a2b32" stroke-width="1"/><text x="374" y="156" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#ecedf1">FastAPI</text><text x="374" y="180" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9da3ae">routes · auth · RBAC</text><rect x="350" y="234" width="380" height="96" rx="8" fill="#1a1b21" stroke="#2a2b32" stroke-width="1"/><text x="374" y="272" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#ecedf1">Retrieval agent</text><text x="374" y="296" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9da3ae">planner → tools → synthesis</text><rect x="350" y="350" width="380" height="96" rx="8" fill="#1a1b21" stroke="#2a2b32" stroke-width="1"/><text x="374" y="388" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#ecedf1">Ingestion pipeline</text><text x="374" y="412" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#9da3ae">read → extract → build</text><path d="M 907.0 146.9 C 886.0 146.9 883.9 119.6 911.2 114.35 C 911.2 86.0 955.3 81.8 968.95 101.75 C 995.2 86.0 1030.9 104.9 1024.6 126.95 C 1048.75 126.95 1050.85 146.9 1026.7 146.9 Z" fill="#1a1b21" stroke="#6c7280" stroke-width="1.8" stroke-linejoin="round"/><text x="970.0" y="172" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" font-weight="700" fill="#ecedf1" text-anchor="middle">Model endpoint</text><text x="970.0" y="192" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#9da3ae" text-anchor="middle">OpenAI-compatible, any host</text><path d="M 931.0 278.48 L 931.0 321.52 A 39.0 12.48 0 0 0 1009.0 321.52 L 1009.0 278.48 A 39.0 12.48 0 0 0 931.0 278.48 Z" fill="#1a1b21" stroke="#2a2b32" stroke-width="1.6"/><ellipse cx="970.0" cy="278.48" rx="39.0" ry="12.48" fill="#1a1b21" stroke="#2a2b32" stroke-width="1.6"/><text x="970.0" y="352" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14" font-weight="700" fill="#ecedf1" text-anchor="middle">Cosmos DB</text><text x="970.0" y="372" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#9da3ae" text-anchor="middle">records · edges · vectors</text><rect x="930.0" y="424" width="33.6" height="13.2" rx="3" fill="#2a2b32"/><rect x="930.0" y="432.4" width="80" height="51.6" rx="6" fill="#1a1b21" stroke="#2a2b32" stroke-width="1.6"/><text x="970.0" y="502" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#ecedf1" text-anchor="middle">storage/</text><text x="970.0" y="522" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11" font-weight="400" fill="#9da3ae" text-anchor="middle">PDFs · pages · extractions · app.db</text><line x1="276" y1="270.0" x2="330" y2="270.0" stroke="#76a3ff" stroke-width="1.8" marker-end="url(#head)"/><line x1="330" y1="290.0" x2="276" y2="290.0" stroke="#76a3ff" stroke-width="1.8" marker-end="url(#head)"/><text x="303.0" y="258.0" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#76a3ff" text-anchor="middle">HTTPS · session token</text><line x1="750" y1="150" x2="830" y2="128" stroke="#9da3ae" stroke-width="1.6" marker-end="url(#head)"/><line x1="750" y1="280.0" x2="830" y2="300" stroke="#4dd4ac" stroke-width="1.6" marker-end="url(#head)"/><line x1="750" y1="440" x2="830" y2="460" stroke="#4dd4ac" stroke-width="1.6" marker-end="url(#head)"/></svg>
