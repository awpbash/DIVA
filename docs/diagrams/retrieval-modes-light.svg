<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" role="img" aria-labelledby="t d"><title id="t">Two retrieval modes, one per kind of question</title><desc id="d">A question splits into two tracks drawn in different styles. On the left, semantic search narrows soft overlapping candidates to a single highlighted clause. On the right, a deterministic query lists every matching field in a ruled table and totals them below a rule, computed in Python rather than by a language model.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect x="290.0" y="32" width="600" height="52" rx="26" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1"/><text x="590.0" y="64" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="17" font-weight="600" fill="#1b1c21" text-anchor="middle">a question arrives</text><path d="M 550.0 84 C 550.0 128, 300 116, 300 152" fill="none" stroke="#3a6fd8" stroke-width="1.6" marker-end="url(#head)"/><path d="M 630.0 84 C 630.0 128, 880 116, 880 152" fill="none" stroke="#3a6fd8" stroke-width="1.6" marker-end="url(#head)"/><text x="300" y="178" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#6c7280" text-anchor="middle" letter-spacing="1.4">THE ANSWER IS IN ONE CLAUSE</text><text x="300" y="204" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#1b1c21" text-anchor="middle">“What is the licence fee?”</text><text x="300" y="232" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#6c7280" text-anchor="middle">semantic search over the verified text</text><rect x="152.0" y="258" width="296" height="10" rx="5" fill="#1b1c21" opacity="0.16"/><rect x="181.0" y="273" width="238" height="10" rx="5" fill="#1b1c21" opacity="0.26"/><rect x="209.0" y="288" width="182" height="10" rx="5" fill="#1b1c21" opacity="0.4"/><rect x="150" y="312" width="300" height="66" rx="4" fill="#ffffff" stroke="#e2e4e9" stroke-width="1"/><rect x="160" y="322" width="280" height="46" rx="3" fill="#ffd35a" opacity="0.55"/><rect x="172" y="334" width="248" height="7" rx="3.5" fill="#1b1c21" opacity="0.72"/><rect x="172" y="353" width="196" height="7" rx="3.5" fill="#1b1c21" opacity="0.72"/><text x="300" y="402" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#a96a05" text-anchor="middle">one clause, cited and highlighted</text><text x="300" y="424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#9aa0ab" text-anchor="middle">fails soft: a near miss is still recoverable</text><text x="880" y="178" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#6c7280" text-anchor="middle" letter-spacing="1.4">THE ANSWER IS A CALCULATION</text><text x="880" y="204" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#1b1c21" text-anchor="middle">“What do the fees total?”</text><text x="880" y="232" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#6c7280" text-anchor="middle">deterministic query over the aligned fields</text><rect x="730" y="258" width="300" height="75" rx="3" fill="none" stroke="#e2e4e9" stroke-width="1"/><text x="744" y="275" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#6c7280">Northwind MSA</text><text x="1016" y="275" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="end">48,000</text><line x1="730" y1="283" x2="1030" y2="283" stroke="#e2e4e9" stroke-width="1"/><text x="744" y="300" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#6c7280">Fairhaven licence</text><text x="1016" y="300" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="end">61,500</text><line x1="730" y1="308" x2="1030" y2="308" stroke="#e2e4e9" stroke-width="1"/><text x="744" y="325" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#6c7280">Harbour Point SOW</text><text x="1016" y="325" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="end">12,750</text><line x1="730" y1="342" x2="1030" y2="342" stroke="#1b1c21" stroke-width="1.6"/><text x="744" y="365" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#6c7280">SGD, all three</text><text x="1016" y="365" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#1b1c21" text-anchor="end">122,250</text><text x="880" y="402" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#0f7a63" text-anchor="middle">added in Python, never by the model</text><text x="880" y="424" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="400" fill="#9aa0ab" text-anchor="middle">exhaustive: a missed row is a wrong answer</text><line x1="64" y1="466" x2="1116" y2="466" stroke="#d8dae0" stroke-width="1" stroke-dasharray="5 5"/><text x="590.0" y="500" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#6c7280" text-anchor="middle">either way the answer names the clauses it used, and “not in the documents” is one of the answers</text></svg>
