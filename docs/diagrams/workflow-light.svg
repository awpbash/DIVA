<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 350" width="1240" height="350" role="img" aria-labelledby="t d"><title id="t">From a PDF to a cited answer</title><desc id="d">A five-step workflow with icons: a PDF is read into text and page boxes, named fields are extracted, document relationships are linked, and a question is answered with a page citation.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><text x="64" y="42" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#3a6fd8" letter-spacing="1.6">FROM DOCUMENT TO ANSWER</text><text x="64" y="70" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="16" font-weight="600" fill="#1b1c21">Five steps, with the source kept beside the result.</text><rect x="64" y="112" width="204" height="166" rx="10" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1.2"/><path d="M 139 134 H 170.16 L 183.28 147.12 V 191.4 H 139 Z" fill="#ffffff" stroke="#3a6fd8" stroke-width="1.8" stroke-linejoin="round"/><path d="M 170.16 134 V 147.12 H 183.28" fill="none" stroke="#3a6fd8" stroke-width="1.8" stroke-linejoin="round"/><line x1="149.66" y1="165.16" x2="172.62" y2="165.16" stroke="#3a6fd8" stroke-width="1.8"/><line x1="149.66" y1="174.18" x2="168.52" y2="174.18" stroke="#3a6fd8" stroke-width="1.8"/><line x1="149.66" y1="183.2" x2="172.62" y2="183.2" stroke="#3a6fd8" stroke-width="1.8"/><text x="166.0" y="237" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="16" font-weight="700" fill="#1b1c21" text-anchor="middle">PDF</text><text x="166.0" y="260" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" fo