<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" role="img" aria-labelledby="t d"><title id="t">The same mechanism, run at nineteen times the scale</title><desc id="d">Two panels side by side. On the left, the flagship demo's single chain of three documents. On the right, the real-world corpus's six independent chains totalling nineteen documents, each drawn to its real length. A caption notes that a real amendment chain caught a bug the synthetic demo never could.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><text x="64" y="44" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#3a6fd8" letter-spacing="1.6">FLAGSHIP DEMO</text><text x="64" y="66" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#6c7280">1 chain · 3 documents</text><rect x="64" y="108" width="118" height="68" rx="6" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1"/><text x="123.0" y="138" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="middle">base</text><text x="123.0" y="156" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="middle">agreement</text><rect x="228" y="108" width="118" height="68" rx="6" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1"/><text x="287.0" y="138" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="middle">first</text><text x="287.0" y="156" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="middle">amendment</text><line x1="226" y1="142.0" x2="302" y2="142.0" stroke="#3a6fd8" stroke-width="1.6" marker-end="url(#head)"/><rect x="392" y="108" width="118" height="68" rx="6" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1"/><text x="451.0" y="138" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="middle">second</text><text x="451.0" y="156" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21" text-anchor="middle">amendment</text><line x1="390" y1="142.0" x2="466" y2="142.0" stroke="#3a6fd8" stroke-width="1.6" marker-end="url(#head)"/><text x="64" y="216" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#6c7280">one base document, two amendments, both declaring what</text><text x="64" y="236" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#6c7280">they amend</text><line x1="588" y1="30" x2="588" y2="430" stroke="#d8dae0" stroke-width="1" stroke-dasharray="5 5"/><text x="636" y="44" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#3a6fd8" letter-spacing="1.6">REAL-WORLD CORPUS</text><text x="636" y="66" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" font-weight="400" fill="#6c7280">6 chains · 19 documents</text><rect x="636" y="100" width="26" height="20" rx="3" fill="#3a6fd8" stroke="#3a6fd8" stroke-width="1" opacity="0.85"/><rect x="670" y="100" width="26" height="20" rx="3" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1" opacity="1"/><line x1="669" y1="110.0" x2="689" y2="110.0" stroke="#9aa0ab" stroke-width="1"/><rect x="704" y="100" width="26" height="20" rx="3" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1" opacity="1"/><line x1="703" y1="110.0" x2="723" y2="110.0" stroke="#9aa0ab" stroke-width="1"/><rect x="738" y="100" width="26" height="20" rx="3" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1" opacity="1"/><line x1="737" y1="110.0" x2="757" y2="110.0" stroke="#9aa0ab" stroke-width="1"/><text x="780" y="114.0" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#6c7280">glu-mobile · 4</text><rect x="636" y="142" width="26" height="20" rx="3" fill="#3a6fd8" stroke="#3a6fd8" stroke-width="1" opacity="0.85"/><rect x="670" y="142" width="26" height="20" rx="3" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1" opacity="1"/><line x1="669" y1="152.0" x2="689" y2="152.0" stroke="#9aa0ab" stroke-width="1"/><rect x="704" y="142" width="26" height="20" rx="3" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1" opacity="1"/><line x1="703" y1="152.0" x2="723" y2="152.0" stroke="#9aa0ab" stroke-width="1"/><text x="746" y="156.0" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#6c7280">netgear-ingram · 3</text><rect x="636" y="184" width="26" height="20" rx="3" fill="#3a6fd8" stroke="#3a6fd8" stroke-width="1" opacity="0.85"/><rect x="670" y="184" width="26" height="20" rx="3" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1" opacity="1"/><line x1="669" y1="194.0" x2="689" y2="194.0" stroke="#9aa0ab" stroke-width="1"/><rect x="704" y="184" width="26" height="20" rx="3" fill="#f5f6f8" stroke="#e2e4e9" stroke-width="1" opacity="1"/><line x1="703" y1="194.0" x2="723" y2="194.0" stroke="#9aa0ab" stroke-width="1"/><text x="746" y="198.0" font-fa