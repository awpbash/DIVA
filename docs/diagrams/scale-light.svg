ke="#9aa0ab" stroke-width="1"/><text x="712" y="324.0" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#6c7280">neon-distributor · 2</text><text x="636" y="368" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#6c7280">each chain is independent. none reference each other</text><line x1="64" y1="386" x2="1116" y2="386" stroke="#d8dae0" stroke-width="1"/><text x="64" y="412" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21">Same walk, six independent chains instead of one. A real chain caught a bug the synthetic one never could: a party</text><text x="64" y="432" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#1b1c21">name with a slash in it broke the graph build for every document processed after it.</text></svg>
