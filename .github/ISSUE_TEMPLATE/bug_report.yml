name: Bug report
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, run `python -m scripts.setup --check`. It catches most
        setup problems and its output is useful here.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `python -m scripts.setup --check`
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: From `GET /branding`, or the commit you are on.

  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options:
        - Docker Compose
        - Python and npm directly
        - Something else
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and Python version

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact anything sensitive. Never paste an API key.
      render: text
