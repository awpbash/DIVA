name: Feature request
description: Suggest something the project should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the problem, not the solution. What does your corpus look like,
        and what do you need out of it that you cannot get today?
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you tried
      description: >
        Share the configuration, commands, or workflow you have tried. A new
        document type is often a useful example, since domains are described
        through YAML as well as application code.

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A sketch of the change, if you have one.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: >
            This proposal can be expressed as reusable behavior for a domain or
            for the application, rather than only for one document.
        - label: >
            This proposal preserves the rule that every answer traces to
            evidence in the source document.
